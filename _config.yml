locale: "en-US"
title: "Junteng Liu"
title_separator: "-"
name: "Junteng Liu"
description: "Personal homepage of Junteng Liu"
url: "https://CrackSerpent.github.io"
baseurl: "/LJT-Homepage"
repository: "CrackSerpent/LJT-Homepage"

breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false

markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
timezone: Etc/UTC

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

comments:
  provider: false

atom_feed:
  hide: true

author:
  name: "Junteng Liu"
  bio: "First-year PhD candidate at HKUST NLP Group"
  email: "jliugi@connect.ust.hk"
  github: "Vicent0205"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"

footer:
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:jliugi@connect.ust.hk"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Vicent0205"
    - label: "Google Scholar"
      icon: "ai ai-google-scholar-square ai-fw"
      url: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

exclude:
  - _pages
  - _posts
  - _portfolio
  - _publications
  - _talks
  - _teaching
  - _drafts
  - markdown_generator
  - talkmap
  - talkmap.ipynb
  - talkmap_out.ipynb
  - talkmap.py
  - Dockerfile
  - docker-compose.yaml
  - package.json
  - scripts
  - files
